project: vad_transformer
seed: 42
run_name: null        # null = <dataset>_<model>; set a new name for a fresh run (same name = resume)

data:
  dataset: ped2            # ped2 | avenue | shanghaitech | ucf_crime
  img_size: 224            # frames are stored at 256 and resized on load
  clip_len: 8              # input frames; target is the NEXT frame (causal)
  target_stride: 1         # use every n-th target frame for training
  val_fraction: 0.1        # fraction of NORMAL train videos held out (threshold + score stats)
  batch_size: 16
  num_workers: 2           # Colab has ~2 CPU cores
  flow_mode: none          # none | precomputed | online   (use 'none' until flow is built)
  flow_size: 128

model:
  name: unet               # unet | spatial_vit | dual_branch | dummy
  hidden: 32               # dummy only
  base_channels: 32        # unet only
  # spatial_vit (Phase 3)
  patch: 16
  embed_dim: 256
  depth: 6
  heads: 8
  mlp_ratio: 4.0
  spatial_frames: 8        # most recent frames stacked in the patch embedding (1 = last frame only)
  residual: true           # predict the change from the last frame
  head_init: zero          # zero (start exactly at copy-last-frame) | small (small random output layer)
  # dual_branch (Phase 4): spatial branch = `depth` blocks on the last `dual_spatial_frames` frame(s)
  dual_spatial_frames: 1
  depth_temporal: 2        # divided space-time attention blocks in the temporal branch
  depth_fusion: 2          # bidirectional cross-attention fusion blocks
  temporal_input: flow     # flow | diff | both   (diff = frame differences, no optical flow needed)
  flow_scale: 12.0         # flow is divided by this (matches the flow cache's clipping range)

train:
  max_epochs: 40
  scheduler: none          # none | cosine (linear warm-up then cosine decay)
  warmup_steps: 300
  gdl_weight: 1.0          # weight of the gradient loss inside L_pred
  lr: 1.0e-4
  weight_decay: 1.0e-5
  precision: "16-mixed"    # saves VRAM on Colab T4
  grad_clip: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 20
  ckpt_every_n_epochs: 1

eval:
  patch: 16                # patch size in pixels at img_size (224 -> 14x14 patches)
  topk: 10                 # frame score = mean of the top-k patch errors
  smooth: 5                # causal trailing window, in frames
  thr_percentile: 99.0     # alarm threshold = this percentile of NORMAL validation scores
  min_consecutive: 1       # frames the score must stay above the threshold (counts toward delay)
  tolerances: [0, 5, 10, 20]  # onset tolerance (frames) for the delay sensitivity analysis
  map_sigma: 4.0           # gaussian smoothing of pixel error maps (localization)
  pixel_samples: 300000    # pixels sampled per video for pixel-level AUC

paths:
  drive_root: /content/drive/MyDrive/vad_project
  local_root: /content/data
